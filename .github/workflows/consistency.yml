name: Consistency

# Per-release agent-consistency regression check (eval/consistency/README.md).
#
# Re-runs the frozen app set in eval/consistency/release-apps.json (apps that
# agents generated from the public docs and that built first try) against a
# fresh pack of the package under release: every app must still build, with
# 0 lint violations, 0 serious/critical axe issues, Jaccard >= 0.85 and light
# pixel diff <= 1.5%. A failure means the package broke code agents already
# wrote correctly. It never calls a model and never writes the ledger; a new
# model's run is still generated by hand (README, "Supplying apps").
#
# Runs on the changesets "Version Packages" PR (one per release) and on demand.
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: consistency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    name: Agent consistency (release)
    if: ${{ github.event_name == 'workflow_dispatch' || github.head_ref == 'changeset-release/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Release check (frozen app set vs this package)
        run: pnpm eval:consistency -- --release
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consistency-screenshots
          path: reports/consistency/
          if-no-files-found: ignore
