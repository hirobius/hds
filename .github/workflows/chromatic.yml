name: Chromatic

# Visual-regression snapshots of the docs site's live demos (Chromatic, via Playwright).
#
# SETUP (one-time, manual — Adrian, not automatable):
#   1. Create a project at chromatic.com linked to this repo.
#   2. Add its token as the `CHROMATIC_PROJECT_TOKEN` Actions *secret*
#      (Settings → Secrets and variables → Actions → Secrets). Claude cannot
#      set this — it lives in the repo secret store, not `.env*`.
#   3. Add a repo *variable* `CHROMATIC_ENABLED = true` (same page → Variables)
#      to switch the job on.
#
# Runs on PRs that touch UI (visual diff) and on pushes to main (baseline
# update). The `if:` guard keeps the job green-skipped until the variable is
# set, so PRs never go red for a missing token before setup is done.
# One job: `chromatic-docs` (the docs site's live demos, via
# @chromatic-com/playwright; tests/visual/docs-demos.spec.ts).
on:
  # Un-shelved 2026-09-14 (#200). The job's `if:` guard below keeps it
  # green-skipped until CHROMATIC_ENABLED is set, so restoring these triggers
  # cannot turn PRs red before the one-time setup above is done.
  pull_request:
    paths: ['src/**', 'docs-site/**', 'tests/visual/**', 'package.json']
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  chromatic-docs:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || vars.CHROMATIC_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build docs site
        run: pnpm docs:publish
      - run: pnpm exec playwright install --with-deps chromium
      # Chromatic's Playwright mode uploads the archives the tests write to
      # test-results/chromatic-archives, so the tests run first.
      - name: Capture docs demos
        run: pnpm test:visual-docs
      - uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          playwright: true
          exitZeroOnChanges: true
          autoAcceptChanges: ${{ github.ref == 'refs/heads/main' }}
