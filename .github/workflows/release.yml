name: Release

# Publishes @hirobius/design-system to the PUBLIC npm registry
# (https://registry.npmjs.org). Anyone can `npm install @hirobius/design-system`
# with no auth — the package is public and unscoped-registry.
#
# Flow (Changesets):
#   1. Feature PRs add a changeset (`pnpm changeset add`) describing the bump.
#   2. On merge to main, this workflow opens/updates a "Version Packages" PR
#      that applies the bumps + updates CHANGELOG.md.
#   3. Merging that PR runs `pnpm release` (build:lib + changeset publish),
#      publishing the new version to public npm.
#
# Auth: npm Trusted Publishing (OIDC). There is no npm token in this workflow.
# The job asks GitHub for a short-lived OIDC token (`id-token: write` below) and
# npm swaps it for a publish credential scoped to this one package, only when
# the run comes from the repo + workflow file registered on npmjs.com. Nothing
# to rotate and nothing that expires (the 2026-09-30 0.17.0 publish failed on
# an expired Automation token; this replaces that mechanism).
#
# One-time setup on npmjs.com (a package admin does this; no secret to copy):
#   https://www.npmjs.com/package/@hirobius/design-system/access
#     → Trusted Publisher → GitHub Actions
#       Organization or user:  hirobius
#       Repository:            hds
#       Workflow filename:     release.yml      (file name only, no path)
#       Environment name:      (leave blank)
#   Renaming this file breaks publishing until that form is updated to match.
#
# The chain: changesets/action@v1 (>= 1.7.0) writes no ~/.npmrc when NPM_TOKEN
# is unset → `pnpm release` → `changeset publish` → `pnpm publish` → pnpm 10
# delegates to the npm CLI on PATH, which does the OIDC exchange. That npm must
# be >= 11.5.1, hence Node 24 below and the guard step that checks it.
# Provenance is attached automatically (public repo + public package); do not
# add --provenance or NPM_CONFIG_PROVENANCE.
#
# If publish fails with ENEEDAUTH / E404 / E401 after this change, the Trusted
# Publisher entry on npmjs.com is missing or does not match (org hirobius, repo
# hds, workflow release.yml, environment blank) — fix it at the URL above.
#
# Never set NPM_TOKEN or NODE_AUTH_TOKEN on this job again: changesets/action v1
# writes NPM_TOKEN into ~/.npmrc when it is present, and a static token would
# then be used instead of OIDC. After the first green publish through OIDC,
# delete the old NPM_TOKEN repo secret
# (https://github.com/hirobius/hds/settings/secrets/actions) and the granular
# token on npmjs.com.
#
# Auth, part two: RELEASE_PAT, and why GITHUB_TOKEN is not enough here.
#
# GitHub deliberately does not start a workflow run from an event created with
# GITHUB_TOKEN — it is the anti-recursion guard. So when this workflow used
# GITHUB_TOKEN to open the "Version Packages" PR, ci.yml (`on: pull_request`)
# never fired on it, and the PR sat with no checks at all. That was invisible
# until `main` required the `Lean gate set` check to merge: PR #266 then became
# permanently unmergeable, because the one check it required could never run.
# Vercel still reported, which made it look like CI had simply chosen not to —
# Vercel is a GitHub App, not a workflow, so the guard does not apply to it.
#
# A user-owned PAT is not subject to the guard, so the release PR gets the same
# CI as any other PR and merges on its own merit rather than on a bypass.
#
# Provision it as the repo secret RELEASE_PAT — a FINE-GRAINED token, scoped to
# this repository only:
#   github.com/settings/personal-access-tokens → Generate new token
#     Resource owner:  hirobius
#     Repository:      only select repositories → hirobius/hds
#     Permissions:     Contents        → Read and write   (version commit, tags)
#                      Pull requests   → Read and write   (open/update the PR)
#   Nothing else. Then add it at Settings → Secrets and variables → Actions as
#   RELEASE_PAT.
#
# Fine-grained tokens EXPIRE. When it does, the guard step below fails the run
# with the variable name and this fix, rather than silently falling back to
# GITHUB_TOKEN and quietly restoring the deadlock.

on:
  # Un-shelved 2026-09-14 (#199). The repo was unfrozen 2026-07-10 (#155) but
  # this trigger was never restored, so nothing shipped after 0.13.0 while work
  # kept merging. The push trigger only opens/updates the Changesets
  # "Version Packages" PR — publishing still requires a human to merge that PR.
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # npm Trusted Publishing: lets npm exchange this run's OIDC token for a
  # publish credential. See the header.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # FIRST step, before checkout: checkout below takes RELEASE_PAT, and an
      # unset secret there fails with a git auth error that names nothing.
      # Fail loud here instead, before anything is checked out, built or
      # published. Without this the run could still "succeed" on a token that
      # cannot trigger CI, and the release PR would silently go back to being
      # unmergeable — the exact failure this secret exists to end.
      # Read through `env`, not `if: ${{ secrets.X == '' }}` — the secrets
      # context is not reliably available in a step-level `if`, and a condition
      # that silently evaluates false would skip the guard entirely, which is
      # the one failure mode a guard must not have.
      - name: Require RELEASE_PAT
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          if [ -n "$RELEASE_PAT" ]; then
            echo "RELEASE_PAT is set."
            exit 0
          fi
          echo "::error::RELEASE_PAT is missing or expired."
          echo "The Version Packages PR must be authored by a user token, not GITHUB_TOKEN:"
          echo "GitHub does not start workflow runs from GITHUB_TOKEN events, so ci.yml"
          echo "never fires on the release PR and the required 'Lean gate set' check can"
          echo "never run, leaving the PR permanently unmergeable."
          echo ""
          echo "Fix: create a fine-grained PAT at"
          echo "  https://github.com/settings/personal-access-tokens"
          echo "  Resource owner: hirobius / Repository: only hirobius/hds"
          echo "  Permissions: Contents = Read and write, Pull requests = Read and write"
          echo "Then add it as the repo secret RELEASE_PAT at"
          echo "  https://github.com/hirobius/hds/settings/secrets/actions"
          exit 1

      # RELEASE_PAT here too, not just on the changesets step below.
      # actions/checkout persists the token it is given into .git/config
      # (persist-credentials defaults to true), and that is the credential
      # changesets uses to PUSH the "Version Packages" branch. Passing the PAT
      # only to the changesets step fixed who AUTHORS the PR through the API
      # while leaving the push itself on GITHUB_TOKEN — so the resulting
      # pull_request event was still attributed to github-actions[bot], and CI
      # on #266 came back `action_required` (run 35811146524) waiting on a
      # human to click Approve. The token that pushes is the one that decides
      # the event's actor, so it has to be the PAT.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_PAT }}

      - uses: pnpm/action-setup@v4

      # Node 24: its bundled npm (11.19.0 on 24.21.0) meets the >= 11.5.1 that
      # trusted publishing needs; Node 20/22 bundle npm 10.x. pnpm 10 publishes
      # through this npm. No registry-url/scope: those only wire NODE_AUTH_TOKEN
      # into a generated .npmrc, and OIDC does not use NODE_AUTH_TOKEN.
      # package.json publishConfig.registry already targets registry.npmjs.org.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Fail loud if the runner's cached Node 24 ships an npm too old for OIDC,
      # rather than letting the publish die with an opaque 401/404.
      - name: Require npm >= 11.5.1 (trusted publishing)
        run: |
          v="$(npm --version)"
          if [ "$(printf '%s\n' 11.5.1 "$v" | sort -V | head -n1)" = "11.5.1" ]; then
            echo "npm $v supports trusted publishing."
            exit 0
          fi
          echo "::error::npm $v is too old for npm trusted publishing (needs >= 11.5.1)."
          echo "Fix: add a step 'run: npm install -g npm@^11.5.1' after setup-node in .github/workflows/release.yml."
          exit 1

      - run: pnpm install --frozen-lockfile

      - name: Create release PR or publish to npm
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: pnpm release
        env:
          # RELEASE_PAT, not GITHUB_TOKEN, authors/updates the "Version Packages"
          # PR and pushes tags. See the header: GITHUB_TOKEN events do not start
          # workflow runs, so with it the release PR gets no CI and cannot
          # satisfy a required check. The step above guarantees it is set.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
          # No NPM_TOKEN / NODE_AUTH_TOKEN: npm auth is Trusted Publishing (OIDC)
          # via `id-token: write`. See the header. Setting NPM_TOKEN here would
          # make changesets/action write it into ~/.npmrc and use it instead.
          # Skip husky git hooks ONLY for the bot "Version Packages" commit this
          # action makes. The hooks are local-dev guards (typecheck/lint/registry)
          # that assume gitignored generated data artifacts exist, which they
          # don't on a fresh CI checkout. Scoped to this step so the earlier
          # `pnpm install` prepare/setup-hooks still runs normally.
          HUSKY: '0'
